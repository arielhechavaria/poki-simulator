name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Kart Royale (MIT, pinned commit) into app assets
        env:
          KART_SHA: 036c0efb025f5ecf8fc31c405e9d818c61e03e21
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          git clone https://github.com/ryancampbell/kart-royale "$RUNNER_TEMP/kart"
          git -C "$RUNNER_TEMP/kart" checkout "$KART_SHA"
          cd "$RUNNER_TEMP/kart"
          npm ci --ignore-scripts
          npx vite build --base=./ --sourcemap false
          if grep -qE '(src|href)="https?://' dist/index.html; then
            echo "Kart Royale loads external resources; refusing to bundle"; exit 1
          fi
          dest="$GITHUB_WORKSPACE/app/src/main/assets/games/kart-royale"
          mkdir -p "$dest"
          cp -r dist/. "$dest/"
          cp LICENSE "$dest/LICENSE.txt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kids-games-debug-apk
          path: app/build/outputs/apk/debug/*.apk
