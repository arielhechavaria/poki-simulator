<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Carros</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4caf50; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Kid-friendly driving game: tap the left or right half of the screen to change
// lane. Collect stars; cones only make a "boing" and slow the car down.
(function () {
  var c = document.getElementById('c'), x = c.getContext('2d');
  var w, h, roadW, roadX, laneW;
  var lane = 1, items = [], score = 0, speed = 0.4, slow = 0, bump = 0;
  var spawnTimer = 0, dashOffset = 0, last = 0, audio = null;

  function resize() {
    var d = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    c.width = w * d; c.height = h * d;
    x.setTransform(d, 0, 0, d, 0, 0);
    roadW = Math.min(w * 0.92, 380);
    roadX = (w - roadW) / 2;
    laneW = roadW / 3;
  }
  window.addEventListener('resize', resize);
  resize();

  function laneCenter(i) { return roadX + laneW * (i + 0.5); }

  function beep(freq, dur) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }

  function steer(dir) { lane = Math.max(0, Math.min(2, lane + dir)); }
  document.addEventListener('pointerdown', function (ev) {
    steer(ev.clientX < w / 2 ? -1 : 1);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowLeft') steer(-1);
    if (ev.key === 'ArrowRight') steer(1);
  });

  function drawCar(cx, cy, s) {
    var bw = s * 0.62, bh = s * 1.05;
    x.fillStyle = '#212121';
    [[-1, -0.32], [1, -0.32], [-1, 0.32], [1, 0.32]].forEach(function (p) {
      x.fillRect(cx + p[0] * bw * 0.5 - s * 0.07, cy + p[1] * bh - s * 0.14, s * 0.14, s * 0.28);
    });
    x.fillStyle = '#e53935';
    if (x.roundRect) {
      x.beginPath();
      x.roundRect(cx - bw / 2, cy - bh / 2, bw, bh, s * 0.18);
      x.fill();
    } else {
      x.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);
    }
    x.fillStyle = '#90caf9';
    x.fillRect(cx - bw * 0.36, cy - bh * 0.22, bw * 0.72, bh * 0.22);
    x.fillStyle = '#fff59d';
    x.fillRect(cx - bw * 0.4, cy - bh / 2 + 2, bw * 0.22, bh * 0.07);
    x.fillRect(cx + bw * 0.18, cy - bh / 2 + 2, bw * 0.22, bh * 0.07);
  }

  function frame(ts) {
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    var carY = h * 0.78;

    speed = Math.min(0.75, speed + dt * 0.004);
    var eff = (slow > 0 ? 0.5 : 1) * speed;
    var px = h * eff;
    if (slow > 0) slow -= dt;
    if (bump > 0) bump -= dt;

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      items.push({ lane: Math.floor(Math.random() * 3), y: -60, star: Math.random() < 0.7 });
      spawnTimer = 0.9 / (eff / 0.4 + 0.5);
    }
    dashOffset = (dashOffset + px * dt) % 60;

    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.y += px * dt;
      if (it.lane === lane && Math.abs(it.y - carY) < laneW * 0.55) {
        if (it.star) { score++; beep(880, 0.12); } else { slow = 1; bump = 0.4; beep(180, 0.25); }
        items.splice(i, 1);
      } else if (it.y > h + 60) {
        items.splice(i, 1);
      }
    }

    x.fillStyle = '#4caf50'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#616161'; x.fillRect(roadX, 0, roadW, h);
    x.fillStyle = '#fff';
    for (var l = 1; l < 3; l++) {
      for (var y = -60 + dashOffset; y < h; y += 60) x.fillRect(roadX + laneW * l - 3, y, 6, 30);
    }
    x.textAlign = 'center'; x.textBaseline = 'middle';
    items.forEach(function (o) {
      x.font = (laneW * 0.6) + 'px sans-serif';
      x.fillText(o.star ? '⭐' : '🚧', laneCenter(o.lane), o.y);
    });
    var wobble = bump > 0 ? Math.sin(bump * 60) * 6 : 0;
    drawCar(laneCenter(lane) + wobble, carY, laneW * 0.9);

    x.font = 'bold 36px sans-serif';
    x.fillStyle = '#fff';
    x.fillText('⭐ ' + score, w / 2, 44);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function (ts) { last = ts; frame(ts); });
})();
</script>
</body>
</html>
